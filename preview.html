  <style>
    *{box-sizing:border-box}
    html{height:100%}
    body{height:100%;margin:0;overflow:hidden;background:#10141c;color:#fff;font:14px -apple-system,BlinkMacSystemFont,sans-serif}
    #app{height:100dvh;min-height:100dvh;display:flex;flex-direction:column;overflow:hidden}
    /* Match the official viewport-locked ancestry, including its minimum
       desktop width. The advanced UI must supply its own scrolling area. */
    .dc04u-page{height:100dvh;min-height:100dvh;min-width:1200px;display:flex;flex-direction:column;overflow:hidden;background:#10141c}
    .dc04u-nav{position:sticky;top:0;z-index:100;height:64px;flex:0 0 64px;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:0 28px;background:#151c27;border-bottom:1px solid #303746}

    .nav-tabs{display:flex;align-items:center;gap:12px;min-width:0}

    .preview-note{color:#93a3bc;font-size:12px;white-space:nowrap}
    .page-scroll{flex:0 0 auto;height:calc(100dvh - 64px);overflow-y:auto;overflow-x:hidden;padding-bottom:clamp(20px,3dvh,40px);overscroll-behavior-y:contain}
    .page-scroll--locked{overflow-y:hidden;padding-bottom:0}
    .page-content--panel{width:100%;max-width:1440px;display:flex;flex-direction:column;min-height:calc(100dvh - 64px);margin:0 auto}
    .preview-intro{padding:50px 28px;text-align:center;color:#a3b1c8}
    .preview-intro h1{margin:0 0 18px;color:#e6ecf6;font-size:25px}
    .preview-intro p{margin:12px 0;line-height:1.7}
    a{color:#c5dda7}
    /* Keep the preview entry reachable on a small test viewport without
       weakening the simulated page's original 1200px minimum width. */
    @media(max-width:1100px){
      .dc04u-nav{width:100%;max-width:100vw;justify-content:flex-start;gap:12px;padding:0 14px}
      .nav-tabs{flex:1 1 auto;overflow-x:auto;overscroll-behavior-x:contain}
      .preview-note{display:none}
    }
  </style>
</head>
